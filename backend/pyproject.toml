[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-ai-backend"
version = "0.1.0"
description = "Recon AI backend foundation"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "langchain-core>=1,<2",
  "openai>=2,<3", "langchain-openai>=1,<2", "uvicorn>=0.34,<1", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
"app.service.llm.role" = ["*.md"]
